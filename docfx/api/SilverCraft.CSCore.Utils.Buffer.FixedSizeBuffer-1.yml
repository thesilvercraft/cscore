  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore.Utils.Buffer
  summary: Reads a sequence of elements from the internal buffer of the <xref href="SilverCraft.CSCore.Utils.Buffer.FixedSizeBuffer%601" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public int Read(T[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: '{T}[]'
      description: >-
        An array of elements. When this method returns, the <code class="paramref">buffer</code> contains the specified

        array with the values between <code class="paramref">offset</code> and (<code class="paramref">offset</code> +

        <code class="paramref">count</code> - 1) replaced by the elements read from the internal buffer.
    - id: offset
      type: System.Int32
      description: >-
        The zero-based offset in the <code class="paramref">buffer</code> at which to begin storing the data

        read from the internal buffer.
    - id: count
      type: System.Int32
      description: The maximum number of elements to read from the internal buffer.
    return:
      type: System.Int32
      description: The total number of elements read into the <code class="paramref">buffer</code>.
    content.vb: Public Function Read(buffer As T(), offset As Integer, count As Integer) As Integer
