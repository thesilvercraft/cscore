- uid: SilverCraft.CSCore.ISampleSource
  commentId: T:SilverCraft.CSCore.ISampleSource
  id: ISampleSource
  parent: SilverCraft.CSCore
  children: []
  langs:
  - csharp
  - vb
  name: ISampleSource
  nameWithType: ISampleSource
  fullName: SilverCraft.CSCore.ISampleSource
  type: Interface
  source:
    remote:
      path: SilverCraft.CSCore/ISampleSource.cs
      branch: master
      repo: https://github.com/thesilvercraft/cscore
    id: ISampleSource
    path: ../SilverCraft.CSCore/ISampleSource.cs
    startLine: 11
  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: Defines the base for all audio streams which provide samples instead of raw byte data.
  remarks: >-
    Compared to the <xref href="SilverCraft.CSCore.IWaveSource" data-throw-if-not-resolved="false"></xref>, the <xref href="SilverCraft.CSCore.ISampleSource" data-throw-if-not-resolved="false"></xref> provides samples instead of raw bytes.

    That means that the <xref href="SilverCraft.CSCore.IAudioSource.Length" data-throw-if-not-resolved="false"></xref> and the <xref href="SilverCraft.CSCore.IAudioSource.Position" data-throw-if-not-resolved="false"></xref> properties

    are expressed in samples.

    Also the <xref href="SilverCraft.CSCore.IReadableAudioSource%601.Read(%600%5b%5d%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> method provides samples instead of raw bytes.
  example: []
  syntax:
    content: 'public interface ISampleSource : IReadableAudioSource<float>, IAudioSource, IDisposable'
    content.vb: Public Interface ISampleSource Inherits IReadableAudioSource(Of Single), IAudioSource, IDisposable
