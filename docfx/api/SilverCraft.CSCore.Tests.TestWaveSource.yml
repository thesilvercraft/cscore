  summary: >-
    Reads a sequence of elements from the <xref href="SilverCraft.CSCore.IReadableAudioSource%601" data-throw-if-not-resolved="false"></xref> and advances the position within the

    stream by the

    number of elements read.
  example: []
  syntax:
    content: public int Read(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: >-
        An array of elements. When this method returns, the <code class="paramref">buffer</code> contains the specified

        array of elements with the values between <code class="paramref">offset</code> and (<code class="paramref">offset</code> +

        <code class="paramref">count</code> - 1) replaced by the elements read from the current source.
    - id: offset
      type: System.Int32
      description: >-
        The zero-based offset in the <code class="paramref">buffer</code> at which to begin storing the data

        read from the current stream.
    - id: count
      type: System.Int32
      description: The maximum number of elements to read from the current source.
    return:
      type: System.Int32
      description: The total number of elements read into the buffer.
