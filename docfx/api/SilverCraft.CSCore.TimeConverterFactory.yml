    id: GetTimeConverterForSource
    path: ../SilverCraft.CSCore/TimeConverterFactory.cs
    startLine: 78
  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: Gets the <xref href="SilverCraft.CSCore.TimeConverter" data-throw-if-not-resolved="false"></xref> for the specified <code class="paramref">source</code>.
  remarks: >-
    The <xref href="SilverCraft.CSCore.TimeConverterFactory.GetTimeConverterForSource%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> chooses the best <xref href="SilverCraft.CSCore.TimeConverter" data-throw-if-not-resolved="false"></xref> for the specified <code class="paramref">source</code>.

    If there is no <xref href="SilverCraft.CSCore.TimeConverterAttribute" data-throw-if-not-resolved="false"></xref> applied to the <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> object (the <code class="paramref">source</code>), it looks up the inheritance hierarchy (interfaces included) of the <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> object

    and searches for all registered source types. If there is a match it returns the associated <xref href="SilverCraft.CSCore.TimeConverter" data-throw-if-not-resolved="false"></xref>. If there are more or less than one match BUT no <xref href="SilverCraft.CSCore.TimeConverterAttribute" data-throw-if-not-resolved="false"></xref>

    it throws an exception.
  example: []
  syntax:
    content: 'public TimeConverter GetTimeConverterForSource<TSource>(TSource source) where TSource : class, IAudioSource'
    parameters:
    - id: source
      type: '{TSource}'
      description: The <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> object to get the <xref href="SilverCraft.CSCore.TimeConverter" data-throw-if-not-resolved="false"></xref> for.
    typeParameters:
    - id: TSource
      description: The type of the <code class="paramref">source</code>.
    return:
      type: SilverCraft.CSCore.TimeConverter
      description: The best <xref href="SilverCraft.CSCore.TimeConverter" data-throw-if-not-resolved="false"></xref> for the specified <code class="paramref">source</code>.
    content.vb: Public Function GetTimeConverterForSource(Of TSource As {Class, IAudioSource})(source As TSource) As TimeConverter
  overload: SilverCraft.CSCore.TimeConverterFactory.GetTimeConverterForSource*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The specified <code class="paramref">source</code> is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Specified type is no AudioSource.;type

      or

      No registered time converter for the specified source type was found.

      or

      Multiple possible time converters, for the specified source type, were found. Specify which time converter to use, through the <xref href="SilverCraft.CSCore.TimeConverterAttribute" data-throw-if-not-resolved="false"></xref>.
  nameWithType.vb: TimeConverterFactory.GetTimeConverterForSource(Of TSource)(TSource)
  fullName.vb: SilverCraft.CSCore.TimeConverterFactory.GetTimeConverterForSource(Of TSource)(TSource)
  name.vb: GetTimeConverterForSource(Of TSource)(TSource)
