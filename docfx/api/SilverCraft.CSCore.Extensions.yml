    path: ../SilverCraft.CSCore/Extensions.cs
    startLine: 83
  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: Converts a duration in raw elements to a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> value. For more information about "raw elements" see remarks.
  remarks: >-
    The term "raw elements" describes the elements, an audio source uses. 

    What type of unit an implementation of the <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> interface uses, depends on the implementation itself.

    For example, a <xref href="SilverCraft.CSCore.IWaveSource" data-throw-if-not-resolved="false"></xref> uses bytes while a <xref href="SilverCraft.CSCore.ISampleSource" data-throw-if-not-resolved="false"></xref> uses samples. 

    That means that a <xref href="SilverCraft.CSCore.IWaveSource" data-throw-if-not-resolved="false"></xref> provides its position, length,... in bytes 

    while a <xref href="SilverCraft.CSCore.ISampleSource" data-throw-if-not-resolved="false"></xref> provides its position, length,... in samples.


    <p></p>


    To get the length or the position of a <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> as a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> value, use the 

    <xref href="SilverCraft.CSCore.Extensions.GetLength(SilverCraft.CSCore.IAudioSource)" data-throw-if-not-resolved="false"></xref> or the <xref href="SilverCraft.CSCore.Extensions.GetPosition(SilverCraft.CSCore.IAudioSource)" data-throw-if-not-resolved="false"></xref> property.


    <p></p><p></p>


    Internally this method uses the <xref href="SilverCraft.CSCore.TimeConverterFactory" data-throw-if-not-resolved="false"></xref> class.
  example: []
  syntax:
    content: public static TimeSpan GetTime(this IAudioSource source, long elementCount)
    parameters:
    - id: source
      type: SilverCraft.CSCore.IAudioSource
      description: >-
        The <xref href="SilverCraft.CSCore.IAudioSource" data-throw-if-not-resolved="false"></xref> instance which provides the <xref href="SilverCraft.CSCore.WaveFormat" data-throw-if-not-resolved="false"></xref> used 
            to convert the duration in "raw elements" to a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> value.
    - id: elementCount
      type: System.Int64
      description: The duration in "raw elements" to convert to a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> value.
    return:
      type: System.TimeSpan
      description: The duration as a <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref> value.
    content.vb: Public Shared Function GetTime(source As IAudioSource, elementCount As Long) As TimeSpan
  overload: SilverCraft.CSCore.Extensions.GetTime*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: >-
      source

      or

      elementCount
  nameWithType.vb: Extensions.GetTime(IAudioSource, Long)
  fullName.vb: SilverCraft.CSCore.Extensions.GetTime(SilverCraft.CSCore.IAudioSource, Long)
  name.vb: GetTime(IAudioSource, Long)
