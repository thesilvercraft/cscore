  name: IWaveSource
  nameWithType: IWaveSource
  fullName: SilverCraft.CSCore.IWaveSource
  type: Interface
  source:
    remote:
      path: SilverCraft.CSCore/IWaveSource.cs
      branch: master
      repo: https://github.com/thesilvercraft/cscore
    id: IWaveSource
    path: ../SilverCraft.CSCore/IWaveSource.cs
    startLine: 11
  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: Defines the base for all audio streams which provide raw byte data.
  remarks: >-
    Compared to the <xref href="SilverCraft.CSCore.ISampleSource" data-throw-if-not-resolved="false"></xref>, the <xref href="SilverCraft.CSCore.IWaveSource" data-throw-if-not-resolved="false"></xref> provides raw bytes instead of samples.

    That means that the <xref href="SilverCraft.CSCore.IAudioSource.Position" data-throw-if-not-resolved="false"></xref> and the <xref href="SilverCraft.CSCore.IAudioSource.Position" data-throw-if-not-resolved="false"></xref> properties are

    expressed in bytes.

    Also the <xref href="SilverCraft.CSCore.IReadableAudioSource%601.Read(%600%5b%5d%2cSystem.Int32%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> method provides samples instead of raw bytes.
  example: []
  syntax:
    content: 'public interface IWaveSource : IReadableAudioSource<byte>, IAudioSource, IDisposable'
    content.vb: Public Interface IWaveSource Inherits IReadableAudioSource(Of Byte), IAudioSource, IDisposable
