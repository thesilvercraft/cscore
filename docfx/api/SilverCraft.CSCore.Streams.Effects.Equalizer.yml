  syntax:
    content: public static Equalizer Create10BandEqualizer(ISampleSource source, int bandWidth, int defaultGain)
    parameters:
    - id: source
      type: SilverCraft.CSCore.ISampleSource
      description: The underlying sample source which provides the data for the equalizer.
    - id: bandWidth
      type: System.Int32
      description: The bandwidth to use for the 10 <xref href="SilverCraft.CSCore.Streams.Effects.EqualizerFilter" data-throw-if-not-resolved="false"></xref>. The default value is 18.
    - id: defaultGain
      type: System.Int32
      description: >-
        The default gain to use for the 10 <xref href="SilverCraft.CSCore.Streams.Effects.EqualizerFilter" data-throw-if-not-resolved="false"></xref>. The default value is zero

        which means that the data, passed through the equalizer won't be affected by the <xref href="SilverCraft.CSCore.Streams.Effects.EqualizerFilter" data-throw-if-not-resolved="false"></xref>.
