  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore.Streams.SampleConverter
  summary: >-
    Reads a sequence of bytes from the <xref href="SilverCraft.CSCore.Streams.SampleConverter.SampleToWaveBase" data-throw-if-not-resolved="false"></xref> and advances the position within the stream by the

    number of bytes read.
  example: []
  syntax:
    content: public abstract int Read(byte[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Byte[]
      description: >-
        An array of bytes. When this method returns, the <code class="paramref">buffer</code> contains the specified

        byte array with the values between <code class="paramref">offset</code> and (<code class="paramref">offset</code> +

        <code class="paramref">count</code> - 1) replaced by the bytes read from the current source.
    - id: offset
      type: System.Int32
      description: >-
        The zero-based byte offset in the <code class="paramref">buffer</code> at which to begin storing the data

        read from the current stream.
    - id: count
      type: System.Int32
      description: The maximum number of bytes to read from the current source.
    return:
      type: System.Int32
      description: The total number of bytes read into the buffer.
    content.vb: Public MustOverride Function Read(buffer As Byte(), offset As Integer, count As Integer) As Integer
