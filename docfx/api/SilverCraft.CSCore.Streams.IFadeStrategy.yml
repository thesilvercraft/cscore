    content: void StartFading(float? from, float to, TimeSpan duration)
    parameters:
    - id: from
      type: System.Nullable{System.Single}
      description: >-
        The start volume in the range from 0.0 to 1.0. If no value gets specified, the default volume will be used.

        The default volume is typically 100% or the current volume.
    - id: to
      type: System.Single
      description: The target volume in the range from 0.0 to 1.0.
