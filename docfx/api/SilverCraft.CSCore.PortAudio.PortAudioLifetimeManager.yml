    id: Terminate
    path: ../SilverCraft.CSCore.PortAudio/PortAudioLifetimeManager.cs
    startLine: 56
  assemblies:
  - SilverCraft.CSCore.PortAudio
  namespace: SilverCraft.CSCore.PortAudio
  summary: Terminates the global PortAudio resources and cleans up associated native structures.
  remarks: >-
    This method safely decrements an internal reference count. Termination only proceeds if the reference count reaches zero and the termination is not manually disabled via <xref href="SilverCraft.CSCore.PortAudio.PortAudioLifetimeManager.IPinkyPromiseToTerminatePortAudioMyself" data-throw-if-not-resolved="false"></xref>.

    If termination occurs, it calls the native PortAudio termination function (<xref href="SilverCraft.CSCore.PortAudio.Native.NativeMethods.Pa_Terminate" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: public static void Terminate(ILogger? log)
    parameters:
    - id: log
      type: Serilog.ILogger
      description: An optional logger used to record any errors encountered during the native PortAudio shutdown process.
    content.vb: Public Shared Sub Terminate(log As ILogger)
  overload: SilverCraft.CSCore.PortAudio.PortAudioLifetimeManager.Terminate*
  nameWithType.vb: PortAudioLifetimeManager.Terminate(ILogger)
  fullName.vb: SilverCraft.CSCore.PortAudio.PortAudioLifetimeManager.Terminate(Serilog.ILogger)
