  assemblies:
  - SilverCraft.CSCore.PortAudio
  namespace: SilverCraft.CSCore.PortAudio
  summary: Prevents the <xref href="SilverCraft.CSCore.PortAudio.PortAudioLifetimeManager" data-throw-if-not-resolved="false"></xref> from automatically terminating PortAudio when instances are disposed.
  remarks: >-
    This method sets an internal flag, effectively suspending the automatic termination logic of PortAudio.

    Call this if you intend to handle the global PortAudio cleanup manually.
  example: []
  syntax:
    content: public static void IPinkyPromiseToTerminatePortAudioMyself()
    content.vb: Public Shared Sub IPinkyPromiseToTerminatePortAudioMyself()
