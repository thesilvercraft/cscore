  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore.Streams
  summary: >-
    Reads a sequence of samples from the <xref href="SilverCraft.CSCore.SampleAggregatorBase" data-throw-if-not-resolved="false"></xref> and advances the position within the stream by

    the number of samples read. Fires the <xref href="SilverCraft.CSCore.Streams.SingleBlockNotificationStream.SingleBlockRead" data-throw-if-not-resolved="false"></xref> event for each block it reads (one block = (number of channels) samples).
  example: []
  syntax:
    content: public override int Read(float[] buffer, int offset, int count)
    parameters:
    - id: buffer
      type: System.Single[]
      description: >-
        An array of floats. When this method returns, the <code class="paramref">buffer</code> contains the specified
            float array with the values between <code class="paramref">offset</code> and (<code class="paramref">offset</code> +
            <code class="paramref">count</code> - 1) replaced by the floats read from the current source.
    - id: offset
      type: System.Int32
      description: >-
        The zero-based offset in the <code class="paramref">buffer</code> at which to begin storing the data
            read from the current stream.
    - id: count
      type: System.Int32
      description: The maximum number of samples to read from the current source.
    return:
      type: System.Int32
      description: The total number of samples read into the buffer.
    content.vb: Public Overrides Function Read(buffer As Single(), offset As Integer, count As Integer) As Integer
