  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore.DSP
  summary: Flips the axis of the matrix and returns the new matrix with the flipped axis.
  remarks: >-
    This could be typically used in the following scenario: There is a

    5.1 to stereo matrix. By using the <xref href="SilverCraft.CSCore.DSP.ChannelMatrix.Flip" data-throw-if-not-resolved="false"></xref> method the 5.1 to stereo matrix can be

    converted into a stereo to 5.1 matrix.
