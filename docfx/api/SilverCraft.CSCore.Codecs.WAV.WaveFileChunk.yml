  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore.Codecs.WAV
  summary: >-
    Parses the <code class="paramref">stream</code> and returns a <xref href="SilverCraft.CSCore.Codecs.WAV.WaveFileChunk" data-throw-if-not-resolved="false"></xref>. Note that the position of the

    stream has to point to a wave file chunk.
  example: []
  syntax:
    content: public static WaveFileChunk FromStream(Stream stream)
    parameters:
    - id: stream
      type: System.IO.Stream
      description: <xref href="System.IO.Stream" data-throw-if-not-resolved="false"></xref> which points to a wave file chunk.
    return:
      type: SilverCraft.CSCore.Codecs.WAV.WaveFileChunk
      description: >-
        Instance of the <xref href="SilverCraft.CSCore.Codecs.WAV.WaveFileChunk" data-throw-if-not-resolved="false"></xref> class or any derived classes. It the stream does not point to a

        wave file chunk the instance of the <xref href="SilverCraft.CSCore.Codecs.WAV.WaveFileChunk" data-throw-if-not-resolved="false"></xref> which gets return will be invalid.
    content.vb: Public Shared Function FromStream(stream As Stream) As WaveFileChunk
  overload: SilverCraft.CSCore.Codecs.WAV.WaveFileChunk.FromStream*
