  parent: SilverCraft.CSCore.IReadableAudioSource`1
  langs:
  - csharp
  - vb
  name: Read(T[], int, int)
  nameWithType: IReadableAudioSource<T>.Read(T[], int, int)
  fullName: SilverCraft.CSCore.IReadableAudioSource<T>.Read(T[], int, int)
  type: Method
  source:
    remote:
      path: SilverCraft.CSCore/IReadableAudioSource.cs
