  namespace: SilverCraft.CSCore.SoundOut.AL
  summary: >-
    Resets the OpenAL Error-Stack, executes the <code class="paramref">alAction</code> and checks

    for an OpenAL Error afterwards. If an error occurs, the a <xref href="SilverCraft.CSCore.SoundOut.AL.ALException" data-throw-if-not-resolved="false"></xref>

    gets thrown.
  remarks: If a OpenAL function, starting with "alc" gets executed, use the <xref href="SilverCraft.CSCore.SoundOut.AL.ALException.Try(System.Action%2cSystem.String%2cSystem.IntPtr)" data-throw-if-not-resolved="false"></xref> method instead.
  example: []
  syntax:
    content: public static void Try(Action alAction, string functionName)
    parameters:
    - id: alAction
      type: System.Action
      description: The action to execute.
    - id: functionName
      type: System.String
      description: The name of the OpenAL function which gets executed by the <code class="paramref">alAction</code>.
    content.vb: Public Shared Sub [Try](alAction As Action, functionName As String)
