  summary: >-
    Initializes a new instance of the <xref href="SilverCraft.CSCore.SoundOut.ALSoundOut" data-throw-if-not-resolved="false"></xref> class based on a initial latency,

    the <xref href="System.Threading.ThreadPriority" data-throw-if-not-resolved="false"></xref> of the playback thread and the <xref href="System.Threading.SynchronizationContext" data-throw-if-not-resolved="false"></xref> used to

