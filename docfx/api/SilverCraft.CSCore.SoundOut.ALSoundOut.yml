  syntax:
    content: public ALSoundOut(int latency, ThreadPriority playbackThreadPriority, SynchronizationContext eventSyncContext)
    parameters:
    - id: latency
      type: System.Int32
      description: The playback latency in milliseconds.
    - id: playbackThreadPriority
      type: System.Threading.ThreadPriority
      description: The <xref href="System.Threading.ThreadPriority" data-throw-if-not-resolved="false"></xref> of the playback thread.
    - id: eventSyncContext
      type: System.Threading.SynchronizationContext
      description: >-
        The <xref href="System.Threading.SynchronizationContext" data-throw-if-not-resolved="false"></xref> which is used to raise any events like the <xref href="SilverCraft.CSCore.SoundOut.ALSoundOut.Stopped" data-throw-if-not-resolved="false"></xref>-event.

        If the passed value is not null, the events will be called async through the

        <xref href="System.Threading.SynchronizationContext.Post(System.Threading.SendOrPostCallback%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> method.
