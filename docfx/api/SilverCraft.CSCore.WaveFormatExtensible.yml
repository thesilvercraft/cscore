- uid: SilverCraft.CSCore.WaveFormatExtensible.ValidBitsPerSample
  commentId: P:SilverCraft.CSCore.WaveFormatExtensible.ValidBitsPerSample
  id: ValidBitsPerSample
  parent: SilverCraft.CSCore.WaveFormatExtensible
  langs:
  - csharp
