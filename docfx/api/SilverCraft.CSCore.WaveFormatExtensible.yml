  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: >-
    Defines the format of waveform-audio data for formats having more than two channels or higher sample resolutions

    than allowed by <xref href="SilverCraft.CSCore.WaveFormat" data-throw-if-not-resolved="false"></xref>.

    Can be used to define any format that can be defined by <xref href="SilverCraft.CSCore.WaveFormat" data-throw-if-not-resolved="false"></xref>.

    For more information see <a href="http://msdn.microsoft.com/en-us/library/windows/hardware/gg463006.aspx">http://msdn.microsoft.com/en-us/library/windows/hardware/gg463006.aspx</a> and

    <a href="http://msdn.microsoft.com/en-us/library/windows/hardware/ff536383(v=vs.85).aspx">http://msdn.microsoft.com/en-us/library/windows/hardware/ff536383(v=vs.85).aspx</a>.
  example: []
  syntax:
    content: 'public class WaveFormatExtensible : WaveFormat, ICloneable, IEquatable<WaveFormat>'
    content.vb: Public Class WaveFormatExtensible Inherits WaveFormat Implements ICloneable, IEquatable(Of WaveFormat)
