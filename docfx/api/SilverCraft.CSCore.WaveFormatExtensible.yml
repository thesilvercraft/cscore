  source:
    remote:
      path: SilverCraft.CSCore/WaveFormatExtensible.cs
      branch: master
      repo: https://github.com/thesilvercraft/cscore
    id: ValidBitsPerSample
    path: ../SilverCraft.CSCore/WaveFormatExtensible.cs
    startLine: 50
  assemblies:
  - SilverCraft.CSCore
  namespace: SilverCraft.CSCore
  summary: >-
    Gets the number of bits of precision in the signal.

    Usually equal to <xref href="SilverCraft.CSCore.WaveFormat.BitsPerSample" data-throw-if-not-resolved="false"></xref>. However, <xref href="SilverCraft.CSCore.WaveFormat.BitsPerSample" data-throw-if-not-resolved="false"></xref> is the

    container size and must be a multiple of 8, whereas <xref href="SilverCraft.CSCore.WaveFormatExtensible.ValidBitsPerSample" data-throw-if-not-resolved="false"></xref> can be any value not

    exceeding the container size. For example, if the format uses 20-bit samples,

    <xref href="SilverCraft.CSCore.WaveFormat.BitsPerSample" data-throw-if-not-resolved="false"></xref> must be at least 24, but <xref href="SilverCraft.CSCore.WaveFormatExtensible.ValidBitsPerSample" data-throw-if-not-resolved="false"></xref> is 20.
  example: []
  syntax:
    content: public int ValidBitsPerSample { get; protected set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property ValidBitsPerSample As Integer
  overload: SilverCraft.CSCore.WaveFormatExtensible.ValidBitsPerSample*
